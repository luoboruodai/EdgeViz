<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">CharWeave Native After Effects character-art plug-in</title>
  <desc id="desc">A dark grid banner with the CharWeave wordmark and a compact field of ASCII glyphs.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#79f2c0"/>
      <stop offset="1" stop-color="#6aa8ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#79f2c0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6aa8ff" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9e7ff" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#10151d"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="url(#grid)" stroke="#2a394b"/>
  <rect x="1" y="1" width="720" height="298" rx="23" fill="url(#glow)"/>
  <circle cx="970" cy="110" r="112" fill="#6aa8ff" fill-opacity=".08" filter="url(#soft)"/>
  <rect x="58" y="52" width="8" height="196" rx="4" fill="url(#accent)"/>
  <text x="96" y="128" fill="#f4f8ff" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="52" font-weight="700" letter-spacing="6">CHARWEAVE</text>
  <text x="100" y="166" fill="#aabbd2" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" letter-spacing="2">NATIVE AFTER EFFECTS CHARACTER ART</text>
  <text x="100" y="214" fill="#79f2c0" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="14">CUSTOM BMP TEXT  /  STYLE LIBRARY  /  DISPERSION</text>
  <g font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="24" text-anchor="middle">
    <g fill="#f4f8ff" fill-opacity=".92">
      <text x="835" y="74">#</text><text x="883" y="74">@</text><text x="931" y="74">+</text><text x="979" y="74">*</text><text x="1027" y="74">:</text><text x="1075" y="74">.</text>
      <text x="835" y="122">%</text><text x="883" y="122">&amp;</text><text x="931" y="122">=</text><text x="979" y="122">?</text><text x="1027" y="122">/</text><text x="1075" y="122">|</text>
      <text x="835" y="170">$</text><text x="883" y="170">0</text><text x="931" y="170">8</text><text x="979" y="170">B</text><text x="1027" y="170">W</text><text x="1075" y="170">M</text>
      <text x="835" y="218">·</text><text x="883" y="218">:</text><text x="931" y="218">+</text><text x="979" y="218">#</text><text x="1027" y="218">@</text><text x="1075" y="218">%</text>
    </g>
    <g fill="url(#accent)">
      <text x="835" y="74">#</text><text x="979" y="122">?</text><text x="931" y="170">8</text><text x="1027" y="218">@</text>
    </g>
  </g>
  <text x="835" y="258" fill="#7186a0" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1">MACOS  /  WINDOWS  /  BETA 2</text>
</svg>
